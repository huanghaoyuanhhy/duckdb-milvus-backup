[package]
name = "milvus_backup_core"
version.workspace = true
edition.workspace = true

[dependencies]
duckdb-neo.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Milvus binlog payloads are ZSTD (parquet-go writer) or uncompressed; SNAPPY
# covers arrow-written storage-v2 files. Decode-only, small crates.
snap = "1"
zstd = "0.13"
